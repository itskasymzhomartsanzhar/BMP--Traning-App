# HTTP: ACME-челлендж certbot + редирект всего остального на HTTPS
server {
    listen 80;
    server_name tresfit.ru www.tresfit.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tresfit.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tresfit.ru www.tresfit.ru;

    ssl_certificate /etc/letsencrypt/live/tresfit.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tresfit.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # www → апекс (после TLS-рукопожатия, сертификат покрывает оба имени)
    if ($host = www.tresfit.ru) {
        return 301 https://tresfit.ru$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API и админка — к Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузка видео упражнений на Kinescope идёт через админку.
        client_max_body_size 1g;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Статика Django (админка) и загруженные файлы
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
    }

    # SPA: ассеты с длинным кэшем, всё остальное — index.html
    location /assets/ {
        root /usr/share/nginx/html;
        expires 365d;
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
